<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube player</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #error { display: none; color: #fff; font: 14px system-ui, sans-serif; padding: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div id="error">This YouTube video link is invalid.</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('videoId') || '';
    const error = document.getElementById('error');

    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
      error.style.display = 'block';
    } else {
      const playerParams = new URLSearchParams({ playsinline: '1', rel: '0' });
      for (const key of ['autoplay', 'mute', 'loop', 'playlist', 'controls', 'rel', 'playsinline']) {
        const value = params.get(key);
        if (value !== null) playerParams.set(key, value);
      }

      const player = document.createElement('iframe');
      player.title = 'YouTube video player';
      player.src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?' + playerParams.toString();
      player.referrerPolicy = 'strict-origin-when-cross-origin';
      player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      player.allowFullscreen = true;
      document.body.appendChild(player);
    }
  </script>
</body>
</html>
